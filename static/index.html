<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mr. Meter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..600&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  /* Mr. Meter design system v1 — paper, ink, one warm accent */
  :root {
    --bg: #FBF6EE;        /* paper */
    --ink: #241F1A;
    --muted: #6E645A;     /* ink soft */
    --rule: #E8DFD1;
    --bubble: #FFFDF9;    /* card */
    --wash: #F3E7D8;
    --accent: #8A5A34;    /* ink brown */
    --accent-dark: #6D461F;
    --ui: 'Instrument Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    --voice: 'Newsreader', Georgia, serif;   /* verse and headings */
    --label: 'IBM Plex Mono', ui-monospace, monospace;
  }
  /* The system is a light, paper-coloured design; this keeps the same roles
     for anyone on a dark OS rather than dropping support for them. */
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17130E; --ink: #EFE7DA; --muted: #9C9184;
      --rule: #322A22; --bubble: #201A14; --wash: #2A2018;
      --accent: #D3A06B; --accent-dark: #E0B486;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.55 var(--ui);
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    padding: 14px 20px; border-bottom: 1px solid var(--rule);
    /* center, not baseline: the wordmark is a flex box (icon + text) and a flex
       box has no text baseline, so baseline alignment drops the label. */
    display: flex; align-items: center; gap: 12px; flex: none;
  }
  header h1 { margin: 0; font: 400 20px var(--voice); letter-spacing: 0; }
  header h1 a { color: inherit; text-decoration: none; display: flex; align-items: center; gap: 9px; }
  header h1 svg { width: 20px; height: 20px; color: var(--accent); }
  header span {
    color: var(--muted); font: 11px/1 var(--label); letter-spacing: .12em;
    text-transform: uppercase; padding-top: 2px;   /* optical: mono caps sit high */
  }
  #log { flex: 1; overflow-y: auto; padding: 24px 20px 8px; }
  .wrap { max-width: 640px; margin: 0 auto; }
  .turn { display: flex; align-items: flex-end; gap: 9px; margin-bottom: 14px; }
  .turn.me { flex-direction: row-reverse; }
  .avatar {
    flex: none; width: 30px; height: 30px; border-radius: 50%;
    display: grid; place-items: center; margin-bottom: 1px;
  }
  .avatar svg { width: 17px; height: 17px; display: block; }
  .avatar.bot { background: var(--bubble); border: 1px solid var(--rule); color: var(--accent); }
  .avatar.me  { background: var(--rule); color: var(--muted); }
  .msg {
    max-width: 78%; padding: 10px 14px; border-radius: 14px;
    white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .msg.bot { background: var(--bubble); border: 1px solid var(--rule); border-bottom-left-radius: 4px; }
  .msg.me  { background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
  .note { margin-left: 39px; }   /* line up with the bubbles, past the avatar */
  .poem {
    margin: 26px 0; padding: 22px 0; border-top: 1px solid var(--rule);
    border-bottom: 1px solid var(--rule);
    font-family: var(--voice); white-space: pre-wrap;
    font-size: 19px; line-height: 1.75;
  }
  .poem h2 { font: 400 26px var(--voice); margin: 0 0 .7em; }
  .note { color: var(--muted); font: 11px/1.6 var(--label); letter-spacing: .1em;
          text-transform: uppercase; margin: 6px 0 18px; }
  .note.warn { color: var(--accent); }
  .dots::after { content: "..."; animation: d 1.2s steps(4, end) infinite; }
  @keyframes d { 0% { content: "" } 25% { content: "." } 50% { content: ".." } 75% { content: "..." } }
  footer { flex: none; border-top: 1px solid var(--rule); padding: 12px 20px 18px; }
  .row { max-width: 640px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
  textarea {
    flex: 1; resize: none; font: inherit; color: inherit; background: var(--bubble);
    border: 1px solid var(--rule); border-radius: 14px; padding: 10px 12px;
    max-height: 140px; min-height: 42px;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button {
    font: inherit; border: 1px solid var(--rule); background: var(--bubble); color: inherit;
    border-radius: 999px; padding: 10px 18px; cursor: pointer; white-space: nowrap;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .45; cursor: default; }
  button.icon { padding: 9px 11px; line-height: 0; }
  button.icon svg { width: 18px; height: 18px; stroke: currentColor; fill: none;
                    stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  #mic.live { background: var(--accent); border-color: var(--accent); color: #fff; }
  #mic.live svg { animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35 } }
  #voice.off { opacity: .4; }
  header .spacer { flex: 1; }
</style>
</head>
<body>
<header>
  <h1><a href="/" title="Back to the front page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 3.2c-7.2.4-12.3 4.7-14 11L4.2 20l5.4-1.9c6.3-2.2 10.2-7.4 10.4-14.9z" fill="currentColor" opacity=".13"/><path d="M20 3.2c-7.2.4-12.3 4.7-14 11L4.2 20l5.4-1.9c6.3-2.2 10.2-7.4 10.4-14.9z" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round"/><path d="M4.6 19.6 12 12.2" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round"/></svg>Mr. Meter</a></h1>
  <span>a poem for someone you like</span>
  <div class="spacer"></div>
  <button id="voice" class="icon" title="Mute Mr. Meter">
    <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path id="wave" d="M17 9.5a4 4 0 0 1 0 5"/></svg>
  </button>
</header>

<div id="log"><div class="wrap" id="wrap"></div></div>

<footer>
  <div class="row">
    <button id="mic" class="icon" title="Speak" disabled>
      <svg viewBox="0 0 24 24"><path d="M12 3a2.5 2.5 0 0 1 2.5 2.5v5a2.5 2.5 0 0 1-5 0v-5A2.5 2.5 0 0 1 12 3z"/><path d="M6 11a6 6 0 0 0 12 0"/><path d="M12 17v3"/></svg>
    </button>
    <textarea id="input" rows="1" placeholder="Say hello..." disabled></textarea>
    <button id="send" class="primary" disabled>Send</button>
    <button id="write" title="Skip ahead and write the poem now" disabled>Write it now</button>
  </div>
</footer>

<script>
const wrap = document.getElementById('wrap');
const log = document.getElementById('log');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const writeBtn = document.getElementById('write');
const micBtn = document.getElementById('mic');
const voiceBtn = document.getElementById('voice');

function autosize() {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 140) + 'px';
}
let sessionId = null, busy = false, done = false;

const atBottom = () => log.scrollHeight - log.scrollTop - log.clientHeight < 60;
function scroll(was) { if (was) log.scrollTop = log.scrollHeight; }

// Inline so the page stays a single self-contained file with no assets to fetch.
const QUILL = '<svg viewBox="0 0 24 24" aria-hidden="true">'
  + '<path d="M20 3.2c-7.2.4-12.3 4.7-14 11L4.2 20l5.4-1.9c6.3-2.2 10.2-7.4 10.4-14.9z"'
  + ' fill="currentColor" opacity=".13"/>'
  + '<path d="M20 3.2c-7.2.4-12.3 4.7-14 11L4.2 20l5.4-1.9c6.3-2.2 10.2-7.4 10.4-14.9z"'
  + ' fill="none" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round"/>'
  + '<path d="M4.6 19.6 12 12.2" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round"/>'
  + '<path d="M15.6 6.6c-2 1.4-3.8 3.4-5.2 5.8" fill="none" stroke="currentColor"'
  + ' stroke-width="1.05" stroke-linecap="round" opacity=".55"/></svg>';

const ANON = '<svg viewBox="0 0 24 24" aria-hidden="true">'
  + '<circle cx="12" cy="8.4" r="3.6" fill="none" stroke="currentColor" stroke-width="1.5"/>'
  + '<path d="M4.6 20c.9-3.9 4-6.1 7.4-6.1s6.5 2.2 7.4 6.1" fill="none"'
  + ' stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>';

function bubble(cls, text = '') {
  const was = atBottom();
  const row = document.createElement('div');
  row.className = 'turn ' + cls;

  const avatar = document.createElement('div');
  avatar.className = 'avatar ' + cls;
  avatar.innerHTML = cls === 'me' ? ANON : QUILL;
  avatar.title = cls === 'me' ? 'You' : 'Mr. Meter';

  const el = document.createElement('div');
  el.className = 'msg ' + cls;
  el.textContent = text;

  row.append(avatar, el);
  wrap.appendChild(row);
  scroll(was);
  return el;   // callers append text to the bubble, not the row
}

function note(text, warn) {
  const el = document.createElement('div');
  el.className = 'note' + (warn ? ' warn' : '');
  el.textContent = text;
  wrap.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

function setBusy(on) {
  busy = on;
  const off = on || done;
  input.disabled = off;
  sendBtn.disabled = off;
  writeBtn.disabled = off || !sessionId;
  micBtn.disabled = (off && !listening) || !sessionId || !SR;
  if (!off) input.focus();
}

// Minimal SSE frame parser. EventSource can't POST and auto-reconnects on
// close, which would re-fire the turn — so we read the body ourselves.
async function stream(url, body, onEvent) {
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify(body),
  });
  if (res.status === 404) { onEvent({ type: 'expired' }); return; }
  if (!res.ok) { onEvent({ type: 'error', message: 'Server error ' + res.status }); return; }

  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let buf = '';
  while (true) {
    const { value, done: fin } = await reader.read();
    if (fin) break;
    buf += dec.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf('\n\n')) !== -1) {
      const frame = buf.slice(0, i).trim();
      buf = buf.slice(i + 2);
      if (frame.startsWith('data:')) onEvent(JSON.parse(frame.slice(5).trim()));
    }
  }
}

async function turn(url, body) {
  setBusy(true);
  let bot = null, poemEl = null, thinking = null;
  let chatVoice = null, poemVoice = null;   // one utterance each

  try {
    await stream(url, body, (ev) => {
      const was = atBottom();
      switch (ev.type) {
        case 'chat_start':
          chatVoice = makeSpeaker('chat');
          thinking = bubble('bot');
          thinking.innerHTML = '<span class="dots"></span>';
          break;
        case 'chat_delta':
          if (thinking) { thinking.textContent = ''; bot = thinking; thinking = null; }
          bot.textContent += ev.text;
          if (chatVoice) chatVoice.feed(ev.text);
          scroll(was);
          break;
        case 'chat_end':
          if (thinking) { thinking.parentElement.remove(); thinking = null; }
          if (chatVoice) { chatVoice.end(); chatVoice = null; }
          break;
        case 'poem_start':
          poemVoice = makeSpeaker('poem');
          poemEl = document.createElement('div');
          poemEl.className = 'poem';
          poemEl.textContent = '';
          wrap.appendChild(poemEl);
          scroll(was);
          break;
        case 'poem_delta':
          poemEl.textContent += ev.text;
          if (poemVoice) poemVoice.feed(ev.text);
          scroll(was);
          break;
        case 'poem_end': {
          // SYSTEM guarantees "title, blank line, poem" — split once the stream
          // has closed rather than fighting token boundaries mid-flight.
          const raw = poemEl.textContent;
          const br = raw.indexOf('\n\n');
          if (br > 0) {
            const h = document.createElement('h2');
            h.textContent = raw.slice(0, br).trim();
            poemEl.textContent = raw.slice(br + 2);
            poemEl.prepend(h);
          }
          if (ev.stop_reason === 'max_tokens') {
            note('That one hit the token ceiling before it finished.', true);
          }
          note('Saved  ' + ev.poem_path);
          done = true;
          finish();
          break;
        }
        case 'expired':
          note('That conversation expired — start a new one.', true);
          done = true;
          finish();
          break;
        case 'error':
          if (thinking) { thinking.parentElement.remove(); thinking = null; }
          if (bot && !bot.textContent.trim()) { bot.parentElement.remove(); bot = null; }
          note(ev.message, true);
          break;
      }
    });
  } catch (e) {
    note('Lost the connection: ' + e.message, true);
  }
  if (chatVoice) chatVoice.end();
  if (poemVoice) poemVoice.end();
  setBusy(false);
}

function finish() {
  const row = document.querySelector('.row');
  row.innerHTML = '';
  const copy = document.createElement('button');
  copy.textContent = 'Copy poem';
  copy.onclick = () => {
    const p = document.querySelector('.poem');
    if (p) navigator.clipboard.writeText(p.innerText).then(() => (copy.textContent = 'Copied'));
  };
  const again = document.createElement('button');
  again.className = 'primary';
  again.textContent = 'New poem';
  again.onclick = () => location.reload();
  row.append(copy, again);
}

async function send() {
  stopListening(false);
  if (!input.value.trim() || busy) return;
  // Dictation arrives unpunctuated whichever way the turn ends — mic, Send or
  // Enter — so the clean-up belongs here rather than on the mic path alone.
  if (dictated) { dictated = false; await tidyText(); }
  const text = input.value.trim();
  if (!text || busy) return;
  stopAudio();
  bubble('me', text);
  input.value = '';
  autosize();
  turn('/turn', { session_id: sessionId, message: text });
}

sendBtn.onclick = send;
micBtn.onclick = () => { if (!busy) toggleMic(); };
voiceBtn.onclick = () => {
  voiceOn = !voiceOn;
  voiceBtn.classList.toggle('off', !voiceOn);
  voiceBtn.title = voiceOn ? 'Mute Mr. Meter' : 'Unmute Mr. Meter';
  if (!voiceOn) stopAudio();
};
writeBtn.onclick = () => { stopListening(false); if (!busy) turn('/write', { session_id: sessionId }); };
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
input.addEventListener('input', () => { dictated = false; autosize(); });

/* ---------------------------------------------------------------------------
   Voice. Entirely optional: if /voice-token 503s (no ElevenLabs key) or the
   socket fails, everything below no-ops and the app stays exactly as it was.

   The browser holds its own WebSocket to ElevenLabs using a short-lived token
   minted server-side, so Claude's text goes straight from this page into TTS
   and no audio ever transits our backend.
--------------------------------------------------------------------------- */

const WS_BASE = 'wss://api.elevenlabs.io/v1/text-to-speech';
const SAMPLE_RATE = 24000;

// Chat wants speed; the poem wants expression. Same price per character.
const VOICE_MODES = {
  chat: {
    model: 'eleven_flash_v2_5',
    settings: { stability: 0.45, similarity_boost: 0.75, style: 0.25, speed: 1.0 },
  },
  poem: {
    // Not eleven_v3 or eleven_v3_conversational — stream-input rejects both,
    // and does it with an abnormal close carrying no error message.
    // multilingual_v2 is the best-sounding model that the socket accepts.
    model: 'eleven_multilingual_v2',
    settings: { stability: 0.65, similarity_boost: 0.75, style: 0.4, speed: 0.92 },
  },
};

let audioCtx = null;
let playCursor = 0;          // when the next chunk should start
let liveSources = [];        // so we can cut playback off mid-word
let voiceOn = true;
let voiceBroken = false;     // set once, after a failure, to stop retrying

function ctx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

// Browsers refuse to start audio without a gesture, so resume on any click.
function unlockAudio() {
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
document.addEventListener('click', () => { ctx(); unlockAudio(); }, { once: true });

function stopAudio() {
  liveSources.forEach((s) => { try { s.stop(); } catch (e) {} });
  liveSources = [];
  playCursor = 0;
}

// ElevenLabs sends raw signed 16-bit PCM. Decoding it by hand is a few lines and
// gives gapless scheduling — MP3 chunks off a socket would need MediaSource.
function playPcm(b64) {
  if (!voiceOn) return;
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const pcm = new Int16Array(bytes.buffer);
  if (!pcm.length) return;

  const ac = ctx();
  const buf = ac.createBuffer(1, pcm.length, SAMPLE_RATE);
  const chan = buf.getChannelData(0);
  for (let i = 0; i < pcm.length; i++) chan[i] = pcm[i] / 32768;

  const src = ac.createBufferSource();
  src.buffer = buf;
  src.connect(ac.destination);
  // Keep a running cursor so chunks butt up against each other seamlessly.
  playCursor = Math.max(playCursor, ac.currentTime);
  src.start(playCursor);
  playCursor += buf.duration;
  liveSources.push(src);
  src.onended = () => { liveSources = liveSources.filter((s) => s !== src); };
}

/* A speaker for one utterance: open a socket, push text as it arrives from
   Claude, flush at boundaries so audio starts before the text is finished. */
function makeVoice(mode) {
  const cfg = VOICE_MODES[mode];
  let ws = null, ready = null, dead = !voiceOn || voiceBroken, gotAudio = false;

  async function open() {
    if (dead) return;
    try {
      const res = await fetch('/voice-token', { method: 'POST' });
      if (!res.ok) { dead = true; voiceBroken = true; return; }
      const { token, voice_id } = await res.json();
      const url = WS_BASE + '/' + voice_id + '/stream-input'
        + '?model_id=' + cfg.model
        + '&output_format=pcm_' + SAMPLE_RATE
        + '&single_use_token=' + encodeURIComponent(token);

      ws = new WebSocket(url);
      ready = new Promise((resolve) => {
        ws.onopen = () => {
          ws.send(JSON.stringify({
            text: ' ',
            voice_settings: cfg.settings,
            // Default first threshold is 120 chars — longer than most of Mr.
            // Meter's replies, so audio would sit buffered until the flush.
            generation_config: { chunk_length_schedule: [50, 120, 200, 290] },
          }));
          resolve();
        };
      });
      ws.onmessage = (ev) => {
        const msg = JSON.parse(ev.data);
        if (msg.audio) { gotAudio = true; playPcm(msg.audio); return; }
        // ElevenLabs reports config problems (bad voice id, unknown model) as a
        // message on the socket, not an HTTP error. Say so once rather than
        // leaving the user wondering why it's silent.
        if (msg.error) {
          dead = true; voiceBroken = true;
          if (!window.__voiceWarned) {
            window.__voiceWarned = true;
            note('Voice off — ' + (msg.message || msg.error), true);
          }
        }
      };
      ws.onerror = () => { dead = true; };
      ws.onclose = (e) => {
        // 1006 with nothing received means the socket was refused outright —
        // an unsupported model does this, with no error message to report.
        if (e.code !== 1000 && !gotAudio && !window.__voiceWarned) {
          window.__voiceWarned = true;
          voiceBroken = true;
          note('Voice off — the speech connection closed unexpectedly (code ' + e.code + ').', true);
        }
      };
      await ready;
    } catch (e) {
      dead = true;
    }
  }

  const started = open();

  return {
    async say(text, flush) {
      if (dead || !text) return;
      await started;
      if (dead || !ws || ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify({ text: text + ' ', flush: !!flush }));
    },
    async close() {
      if (dead) return;
      await started;
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify({ flush: true }));
      ws.send(JSON.stringify({ text: '' }));
      // Let the tail of the audio arrive before dropping the socket.
      setTimeout(() => { try { ws.close(); } catch (e) {} }, 8000);
    },
  };
}

/* Buffers deltas and decides when to flush.
   Chat flushes on sentence ends; the poem flushes on stanza breaks, so the
   pauses you hear are the poem's own line breaks. */
function makeSpeaker(mode) {
  const v = makeVoice(mode);
  const boundary = mode === 'poem' ? /\n\n/ : /[.!?]["')\]]?\s/;
  let buf = '';
  return {
    feed(chunk) {
      buf += chunk;
      let m;
      while ((m = boundary.exec(buf))) {
        const end = m.index + m[0].length;
        v.say(stripMarkup(buf.slice(0, end)), true);
        buf = buf.slice(end);
      }
    },
    end() {
      if (buf.trim()) v.say(stripMarkup(buf), true);
      buf = '';
      v.close();
    },
  };
}

// The poem occasionally arrives with a Markdown heading; spoken aloud that
// becomes "number sign". Also drop emphasis asterisks.
function stripMarkup(s) {
  return s.replace(/^#+\s*/gm, '').replace(/\*/g, '');
}

/* --------------------------- microphone --------------------------- */

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recog = null, listening = false, wantStop = false, sendOnEnd = false, committed = '';
let dictated = false;   // the box holds speech, not typing — tidy it before sending

// Chrome ends recognition at the first pause. With continuous listening plus a
// restart-on-silence loop, you can think mid-sentence without the turn being
// cut off and sent — you decide when you're finished by tapping the mic again.
function startRecog() {
  recog = new SR();
  recog.lang = 'en-US';
  recog.interimResults = true;
  recog.continuous = true;

  recog.onresult = (e) => {
    // stop() is asynchronous and Mr. Meter starts speaking straight away, so
    // without this guard his reply gets transcribed into the input box.
    if (!listening) return;
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      // Chrome returns finals with no trailing space, so joining them raw
      // fuses the last word of one phrase onto the first of the next.
      if (e.results[i].isFinal) committed += t.trim() + ' ';
      else interim += t;
    }
    input.value = (committed + interim).replace(/\s+/g, ' ').trim();
    dictated = true;
    autosize();
  };

  recog.onerror = (e) => {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
      note('Microphone blocked — type instead.', true);
      stopListening(false);
    }
    // 'no-speech' and 'aborted' are normal during a pause; onend restarts.
  };

  recog.onend = () => {
    if (wantStop) {
      wantStop = false;
      if (sendOnEnd) {
        sendOnEnd = false;
        if (input.value.trim() && !busy) send();
      }
      return;
    }
    // A silence, not a stop — keep the turn alive.
    try { recog.start(); } catch (err) { stopListening(false); }
  };

  try {
    recog.start();
  } catch (err) {
    stopListening(false);
  }
}

// Close the mic. `andSend` separates "tapped the mic to finish" from every
// other way a turn can end — Send, Write it now, an error. Those must also
// close it, or the open microphone hears Mr. Meter and types his reply back.
function stopListening(andSend) {
  if (!listening) return;
  listening = false;
  wantStop = true;
  sendOnEnd = !!andSend;
  micBtn.classList.remove('live');
  micBtn.title = 'Speak';
  input.placeholder = 'Type a message, or tap the mic...';
  try {
    recog.stop();
  } catch (e) {
    wantStop = false;
    sendOnEnd = false;
  }
}

// Speech recognition returns no punctuation, so clean the dictation up before
// it goes to Mr. Meter — and before it lands in the transcript the poet reads.
// Strictly best-effort: any failure or delay sends the raw words instead.
async function tidyText() {
  const raw = input.value.trim();
  if (!raw) return;
  const held = input.placeholder;
  input.placeholder = 'Tidying that up...';
  input.disabled = true;
  try {
    const ctrl = new AbortController();
    const bail = setTimeout(() => ctrl.abort(), 6000);
    const res = await fetch('/tidy', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ text: raw }),
      signal: ctrl.signal,
    });
    clearTimeout(bail);
    if (res.ok) {
      const data = await res.json();
      if (data.text) input.value = data.text;
    }
  } catch (e) {
    input.value = raw;   // timed out or failed — send what they actually said
  }
  input.disabled = false;
  input.placeholder = held;
  autosize();
}

function toggleMic() {
  if (listening) { stopListening(true); return; }   // done talking -> send
  if (!SR) return;
  stopAudio();               // don't transcribe Mr. Meter's own voice
  ctx(); unlockAudio();

  committed = '';
  input.value = '';
  listening = true;
  micBtn.classList.add('live');
  micBtn.title = 'Done talking';
  input.placeholder = 'Listening — take your time, tap the mic when you are done';
  startRecog();
}

(async function start() {
  const res = await fetch('/session', { method: 'POST' });
  sessionId = (await res.json()).session_id;
  input.placeholder = SR ? 'Type a message, or tap the mic...' : 'Type a message...';
  if (SR) micBtn.disabled = false; else micBtn.style.display = 'none';
  await turn('/turn', { session_id: sessionId, message: '' });  // greeting
})();
</script>
